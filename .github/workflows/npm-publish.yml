name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      #   - name: Run tests
      # run: npm test

      - name: Build packages
        run: npm run build:all

      - name: Publish posty5-core
        working-directory: ./posty5-core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting
        working-directory: ./posty5-html-hosting
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting-form-submission
        working-directory: ./posty5-html-hosting-form-submission
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting-variables
        working-directory: ./posty5-html-hosting-variables
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-qr-code
        working-directory: ./posty5-qr-code
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # New in 4.7.0 (qr-design-and-export): the QR design engine. No @posty5/core dependency.
      - name: Publish posty5-qr-design
        working-directory: ./posty5-qr-design
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-short-link
        working-directory: ./posty5-short-link
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-social-publisher-post
        working-directory: ./posty5-social-publisher-post
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-social-publisher-workspace
        working-directory: ./posty5-social-publisher-workspace
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Last on purpose: it was never published by CI before 4.3.0, and a run that
      # stops earlier (an unchanged package's version already exists) can be
      # re-run from workflow_dispatch with this step the easiest to reach.
      - name: Publish posty5-store
        working-directory: ./posty5-store
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # New in 4.3.0 (mcp-server feature): who a key is, credits, prices.
      - name: Publish posty5-account
        working-directory: ./posty5-account
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # New in 4.5.0 (link-qr-bulk-and-webhooks): endpoint client + verifyWebhookSignature.
      - name: Publish posty5-webhooks
        working-directory: ./posty5-webhooks
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # New in 1.0.0 (mcp-server feature): every SDK service as MCP tools, plus the stdio binary.
      # After posty5-account: it depends on every package above at the versions just published.
      - name: Publish posty5-mcp
        working-directory: ./posty5-mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
