name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      #   - name: Run tests
      # run: npm test

      - name: Build packages
        run: npm run build:all

      - name: Publish posty5-core
        working-directory: ./posty5-core
        # A version already on npm is skipped, so a tag publishes only the
        # packages whose version changed (the run used to stop at the first).
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - skipped"
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting
        working-directory: ./posty5-html-hosting
        # A version already on npm is skipped, so a tag publishes only the
