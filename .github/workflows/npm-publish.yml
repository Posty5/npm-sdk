name: Publish to NPM

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm install

      #   - name: Run tests
      # run: npm test

      - name: Build packages
        run: npm run build:all

      - name: Publish posty5-core
        working-directory: ./posty5-core
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting
        working-directory: ./posty5-html-hosting
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting-form-submission
        working-directory: ./posty5-html-hosting-form-submission
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-html-hosting-variables
        working-directory: ./posty5-html-hosting-variables
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-qr-code
        working-directory: ./posty5-qr-code
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-short-link
        working-directory: ./posty5-short-link
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-social-publisher-post
        working-directory: ./posty5-social-publisher-post
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish posty5-social-publisher-workspace
        working-directory: ./posty5-social-publisher-workspace
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 📧 Send publish email notification
        if: always() # if the publish succeeds or fails
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          from: "Posty5 Deploy Bot <${{ secrets.SMTP_USER }}>"
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: |
            [${{ github.repository }}] 📦 Publish ${{ job.status }} — ${{ github.ref_name }}
          body: |
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Status: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
